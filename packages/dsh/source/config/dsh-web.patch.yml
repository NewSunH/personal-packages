# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# 2026-08-24：官方 web bundle 默认禁用 skill-filesystem（技能文件系统发现），
# 导致 skills/ 下的自定义技能无法被会话发现。按最小集启用发现源（不启用自动注入与工具层）。
- id: skill-filesystem
  disabled: false

- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
        systemPromptUpdate: in-history
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
# 搜索/抓取显式指定：原生 DeepSeek 搜索由 @deepseek-ai/dsh-web-search-deepseek 提供；
# 抓取固定走匿名 HTTP（避免 deepseek-fetch-api 与 http 两个 provider 的歧义）。
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http
- id: locale
  config:
    preference: zh
- id: ui-settings-general
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: better-sidebar
  config:
    openByDefault: true
    defaultWidthPercent: 20
- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: standard
